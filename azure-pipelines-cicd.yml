trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'Customer Website/**'
      - 'Customer API/**'

variables:
  # Service Connection for Azure Resource Manager
  azureSubscriptionConnection: 'CF-service-connection'
  
  # Azure Container Registry Details
  acrLoginServer: 'acrfonteyntest.azurecr.io'
  acrName: 'acrfonteyntest'
  resourceGroupName: 'Proftask_Resource_Group'
  
  # Website Configuration
  websiteImageName: 'customer-website'
  websiteContainerAppName: 'wa-customer-website'
  websiteDockerfile: 'Customer Website/Dockerfile'
  websiteContext: 'Customer Website'
  
  # API Configuration
  apiImageName: 'customer-api'
  apiContainerAppName: 'customer-api'
  apiDockerfile: 'Customer API/Dockerfile'
  apiContext: 'Customer API'
  
  # Tag images with the build ID
  tag: '$(Build.BuildId)'

pool:
  name: 'Default'

stages:
- stage: Test
  displayName: 'Security & Quality Checks'
  jobs:
  - job: RunChecks
    displayName: 'Run Linting and Security Scans'
    steps:
    - powershell: |
        # Create and activate virtual environment
        python -m venv venv
        .\venv\Scripts\activate
        
        # Install dependencies inside venv
        python -m pip install --upgrade "pip>=25.3"
        pip install flake8 bandit pip-audit
        pip install -r "Customer API/requirements.txt"
        pip install -r "Customer Website/requirements.txt"
      displayName: 'Install Test Dependencies (Venv)'

    # --- Code Linting ---
    - powershell: |
        Write-Host "Running Flake8 Linting..."
        .\venv\Scripts\activate
        
        # Stop the build if there are Python syntax errors or undefined names
        # Scan specific directories ensuring we don't scan venv
        flake8 "Customer Website" "Customer API" --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 "Customer Website" "Customer API" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      displayName: 'Code Linting (Flake8)'

    # --- Security Scanning ---
    - powershell: |
        Write-Host "Running Bandit Security Scan..."
        .\venv\Scripts\activate
        # Explicitly scan only project directories to avoid scanning venv
        bandit -r "Customer Website" "Customer API" -ll
      displayName: 'Security Scanning (Bandit)'

    # --- Dependency Scanning ---
    - powershell: |
        Write-Host "Running Dependency Audit..."
        .\venv\Scripts\activate
        pip-audit
      displayName: 'Dependency Scanning (pip-audit)'

- stage: ApproveBuild
  displayName: Approve Build
  dependsOn: Test
  jobs:
  - deployment: Approve
    displayName: Wait for Approval
    environment: 'Production'
    pool: 
      name: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - powershell: Write-Host "Build Approved"

- stage: Build
  displayName: Build and Push Images
  dependsOn: ApproveBuild
  jobs:
  - job: BuildWebsite
    displayName: Build Website Image
    steps:
    - task: AzureCLI@2
      displayName: Build and Push Website
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)
          docker build -f "$(websiteDockerfile)" -t $(acrLoginServer)/$(websiteImageName):$(tag) -t $(acrLoginServer)/$(websiteImageName):latest "$(websiteContext)"
          docker push $(acrLoginServer)/$(websiteImageName):$(tag)
          docker push $(acrLoginServer)/$(websiteImageName):latest

  - job: BuildAPI
    displayName: Build API Image
    steps:
    - task: AzureCLI@2
      displayName: Build and Push API
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)
          docker build -f "$(apiDockerfile)" -t $(acrLoginServer)/$(apiImageName):$(tag) -t $(acrLoginServer)/$(apiImageName):latest "$(apiContext)"
          docker push $(acrLoginServer)/$(apiImageName):$(tag)
          docker push $(acrLoginServer)/$(apiImageName):latest

- stage: Deploy
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  jobs:
  - job: DeployApps
    displayName: Update Container Apps
    steps:
    - task: AzureCLI@2
      displayName: Update Website Container App
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Deploying Website..."
          az containerapp update `
            --name $(websiteContainerAppName) `
            --resource-group $(resourceGroupName) `
            --image $(acrLoginServer)/$(websiteImageName):$(tag)

    - task: AzureCLI@2
      displayName: Update API Container App
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Deploying API..."
          az containerapp update `
            --name $(apiContainerAppName) `
            --resource-group $(resourceGroupName) `
            --image $(acrLoginServer)/$(apiImageName):$(tag)
