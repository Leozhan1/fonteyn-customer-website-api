{% extends "base.html" %}
{% block title %}Find your next getaway | Fonteyn{% endblock %}

{% block content %}
<!-- Flatpickr CSS (CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<div class="max-w-5xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold text-brand-dark text-center mb-10">
        Find your next getaway
    </h1>

    <div class="bg-white rounded-2xl shadow-xl p-8 space-y-6">

        <!-- One-day visit -->
        <div class="flex items-center gap-3">
            <input id="oneDay" type="checkbox" class="w-5 h-5">
            <label class="font-medium">One-day visit</label>
        </div>

        <!-- Dates -->
        <div class="grid md:grid-cols-2 gap-6">
            <div>
                <label class="text-sm font-semibold">From</label>
                <input id="startDate" type="text" placeholder="Select start date"
                    class="w-full rounded-lg border-gray-300 focus:ring-brand-green focus:border-brand-green">
            </div>

            <div>
                <label class="text-sm font-semibold">To</label>
                <input id="endDate" type="text" placeholder="Select end date"
                    class="w-full rounded-lg border-gray-300 focus:ring-brand-green focus:border-brand-green">
            </div>
        </div>

        <!-- Guests -->
        <div>
            <label class="text-sm font-semibold">Guests</label>
            <input id="guests" type="number" min="1" value="2"
                class="w-full rounded-lg border-gray-300 focus:ring-brand-green focus:border-brand-green">
        </div>

        <!-- Park -->
        <div>
            <label class="text-sm font-semibold">Park location</label>
            <select id="park" class="w-full rounded-lg border-gray-300 focus:ring-brand-green focus:border-brand-green">
                <option value="Netherlands">Netherlands</option>
                <option value="Belgium">Belgium</option>
                <option value="Germany">Germany</option>
            </select>
        </div>

        <!-- CTA -->
        <button type="button" onclick="submitHomepage()"
            class="w-full bg-brand-green text-white font-semibold py-3 rounded-xl hover:bg-brand-dark transition">
            Continue
        </button>

        <p id="error" class="text-red-500 text-sm hidden"></p>
    </div>
</div>

<!-- Flatpickr JS + range plugin (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/rangePlugin.js"></script>

<!-- Your page JS -->
<script src="{{ url_for('static', filename='js/homepage.js') }}"></script>
{% endblock %}
