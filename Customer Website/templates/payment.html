{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>60 / 40 Layout</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/payment.css') }}">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .container {
      display: grid;
      grid-template-columns: 60% 40%;
      height: 80vh; /* full viewport height */
    }

    .left {
      padding: 20px;
      background: #f5f5f0;
    }

    .right {
      padding: 20px;
      background: #e0e0e0;
    }
  </style>
</head>
<body>

    <div class="container">
        <div id="left">
            <H1>Hi there, ready to make a payment?</H1>

            <br>
            <form method="post">
                <button type="submit" style=" background-color: lightgreen;">Proceed to Payment</button>
            </form>  
            <hr>

        </div>
        <div id="right">
            <h3>Payment Summary</h3>
            <br>
            <hr>
            <p><strong>Number of Guests:</strong> {{ guests }}</p>
            <p><strong>Valid for: </strong> {{ days_staying }} Days</p>
            <p id="paymet"><strong>Ticket Price:</strong> €{{ ticketprice }}</p>
            <hr>
            <br>
            <br>
            <br>
            <hr>
            <p id="total">Total: €{{ total }}</p>
        </div>
    </div>
</body>
</html>

{% endblock %}
