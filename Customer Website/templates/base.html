<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fonteyn Holidayparks{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#8FB388',
                            dark: '#2F4F4F',
                            light: '#F5F9F5',
                            accent: '#A8C3A0'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-brand-light flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white/70 backdrop-blur-xl backdrop-saturate-150 border-b border-white/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <!-- Logo -->
                <a href="{{ url_for('homepage.homepage') }}" class="flex-shrink-0 flex items-center gap-2 cursor-pointer">
                    <div class="bg-brand-dark text-white p-2 rounded-lg">
                        <i class="fa-solid fa-tree text-2xl"></i>
                    </div>
                    <span class="font-bold text-2xl text-brand-dark tracking-tight">Holidayparks</span>
                </a>
                <!-- Right Side Actions -->
                <div class="hidden lg:flex items-center space-x-4">
                    {% if session.get('user') %}
                    <a href="{{ url_for('payments.pay') }}"
                        class="flex items-center space-x-2 text-gray-600 hover:text-brand-dark font-medium px-3 py-2 rounded-lg hover:bg-gray-100 transition">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span class="font-bold text-lg">Cart</span>
                    </a>
                    <a href="{{ url_for('login.profile') }}"
                        class="flex items-center space-x-2 text-gray-600 hover:text-brand-dark font-medium px-3 py-2 rounded-lg hover:bg-gray-100 transition">
                        <i class="fa-solid fa-user text-xl"></i>
                        <span class="font-bold text-lg">Profile</span>
                    </a>
                    <a href="{{ url_for('login.logout') }}"
                        class="flex items-center space-x-2 text-red-600 hover:text-red-700 font-medium px-3 py-2 rounded-lg hover:bg-red-50 transition">
                        <i class="fa-solid fa-right-from-bracket text-xl"></i>
                        <span class="font-bold text-lg">Logout</span>
                    </a>
                    {% else %}
                    <a href="{{ url_for('login.login') }}"
                        class="flex items-center space-x-2 text-gray-600 hover:text-brand-dark font-medium px-3 py-2 rounded-lg hover:bg-gray-100 transition">
                        <i class="fa-regular fa-circle-user text-xl"></i>
                        <span class="font-bold text-lg">Login</span>
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark text-white pt-12 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <!-- Brand -->
                <div class="col-span-1">
                    <div class="flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-tree text-2xl text-brand-green"></i>
                        <span class="font-bold text-xl">Holidayparks</span>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed">
                        Discover the perfect getaway in nature. Sustainable, comfortable, and unforgettable holiday
                        experiences.
                    </p>
                </div>
            </div>

            <div
                class="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-gray-400">
                <p>&copy; 2025 Fonteyn Holidayparks. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>

</html>
